name: V2 tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile scripts
        run: python -m py_compile scripts/pdm_to_gaussdb.py scripts/sql_linter.py scripts/validate_pdm_output.py
      - name: Run safety tests
        run: python -m unittest discover -s tests -v
